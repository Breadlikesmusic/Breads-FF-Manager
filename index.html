<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breads FastFlags Manager</title>
    <style>
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #1a1a1a;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h1 {
            color: #ffffff;
            font-weight: 300;
            margin-bottom: 0.2rem;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .version {
            background: #2a2a2a;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: #2a7a4a;
            color: white;
            padding: 0.8rem 2.2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            margin: 0.3rem;
        }
        .btn:hover {
            background: #3a9a5a;
            transform: scale(1.03);
        }
        .btn-secondary {
            background: #3a3a3a;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
        }
        .note {
            background: #1a1a2a;
            border-left: 3px solid #2a7a4a;
            padding: 0.5rem 1rem;
            margin: 1.5rem 0;
            text-align: left;
            font-size: 0.85rem;
            color: #aaa;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Breads FastFlags Manager</h1>
        <div class="subtitle">A simple, clean tool to manage Roblox FastFlags</div>
        <div class="version">v1.0.0</div>

        <div>
            <a href="#" class="btn" id="downloadBtn">⬇️ Download</a>
            <a href="#" class="btn btn-secondary">📖 GitHub</a>
        </div>

        <div class="note">
            ✅ Works on Windows 10/11<br>
            ✅ No installation – just run the .exe<br>
            ⚠️ Antivirus may flag it – add an exception, it's safe!
        </div>

        <div class="footer">
            Made for Roblox · Free to use
        </div>
    </div>

    <script>
        // You'll replace this with your actual .exe download link later
        document.getElementById('downloadBtn').href = '#';
    </script>
</body>
</html>
